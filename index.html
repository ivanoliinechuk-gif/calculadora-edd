<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora</h1>
    <form action="#" method="post">
        <label for="num1">Primer numero entero [-99999...99999]:</label>
        <input type="number" id="num1" name="num1" min="-99999" max="99999" step="1" required>
        <br><br>

        <label for="operacion">Operacion:</label>
        <select id="operacion" name="operacion" required>
            <option value="suma">Suma</option>
            <option value="resta">Resta</option>
            <option value="multiplicacion">Multiplicacion</option>
            <option value="potencia">Potencia</option>
        </select>
        <br><br>

        <label for="num2">Segundo numero entero [-99999...99999]:</label>
        <input type="number" id="num2" name="num2" min="-99999" max="99999" step="1" required>
        <br><br>

        <button type="submit">Calcular</button>
    </form>
</body>
</html>
